<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="border:2px solid rgb(71, 151, 255);"class="login-box">
    <h1>Perpustakaan Fakultas Teknik</h1>
    <form>
      <div class="form-row">
        <label> Email:</label>
        <input style="border:2px solid rgb(71, 151, 255);" type="email" name="email">
      </div>
      <div class="form-row">
        <label>Password:</label>
        <input style="border:2px solid rgb(71, 151, 255);"type="password" name="password">
      </div>
      <button style="border:2px solid rgb(71, 151, 255);"type="submit">Sign In</button> 
    </form>
  </div>
</body>
</html>
